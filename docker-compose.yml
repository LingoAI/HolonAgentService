services:
  marketplace:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      HIRE_NETWORK: ${HIRE_NETWORK:-xlayer-testnet}
      HOLON_INDEX_ON_BOOT: "0"
    volumes:
      - marketplace-data:/app/data
      - ./contracts/deployments:/app/contracts/deployments:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  marketplace-data:
